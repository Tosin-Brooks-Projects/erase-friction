<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#f5f4f0"/>
  <!-- "e" in teal, "f" in dark -->
  <text x="4" y="24" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="20" fill="#0d9488">e</text>
  <text x="16" y="24" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="20" fill="#0f172a">f</text>
  <!-- Red X -->
  <line x1="8" y1="8" x2="24" y2="24" stroke="#e53e3e" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.65"/>
  <line x1="24" y1="8" x2="8" y2="24" stroke="#e53e3e" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.65"/>
</svg>
