<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Money-Leak Checklist — erase friction</title>
  <meta name="description" content="View and download your Money-Leak Checklist. A copy is also on its way to your inbox." />
  <!-- Post-conversion page: no SEO value, keep it out of the index. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V6HBH3FB5B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V6HBH3FB5B');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --color-bg: #f5f4f0;
      --color-surface: #ffffff;
      --color-text: #1a1a1a;
      --color-muted: #5f6774;
      --color-accent: #0d9488;
      --color-accent-hover: #0f766e;
      --color-accent-deep: #115e59;
      --color-accent-tint: #f0fdfa;
      --color-accent-light: #ccfbf1;
      --color-border: #e5e7eb;
      --font-base: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-base);
      color: var(--color-text);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: var(--color-accent-hover); text-decoration: none; }
    a:hover { color: var(--color-accent); }

    .navbar {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 1px 0 var(--color-border);
    }

    .nav-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; max-width: 1100px; margin: 0 auto;
    }

    .nav-logo { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.02em; color: inherit; }
    .nav-logo .logo-erase { color: var(--color-accent); }
    .nav-logo .logo-friction {
      text-decoration: line-through;
      text-decoration-color: var(--color-accent);
      text-decoration-thickness: 1.5px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .card {
      max-width: 560px;
      text-align: center;
    }

    .cover-link {
      display: inline-block;
      margin: 0 auto 1.75rem;
      border-radius: 10px;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .cover-link img {
      display: block;
      width: min(240px, 60vw);
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14), 0 4px 8px rgba(0, 0, 0, 0.08);
    }

    .cover-link:hover {
      transform: translateY(-4px);
    }

    .cover-link:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 4px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    /* .btn.btn-secondary outranks the .btn base rules defined further down. */
    .btn.btn-secondary {
      background: var(--color-surface);
      color: var(--color-accent-hover);
      border: 1.5px solid var(--color-accent-light);
      box-shadow: none;
    }

    .btn.btn-secondary:hover {
      background: var(--color-accent-tint);
      color: var(--color-accent-deep);
    }

    h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .lede { font-size: 1.0625rem; color: var(--color-muted); line-height: 1.6; margin-bottom: 1rem; }
    .fine { font-size: 0.9rem; color: var(--color-muted); margin-bottom: 2rem; }

    .btn {
      display: inline-flex; align-items: center; gap: 0.25rem;
      font-family: var(--font-base); font-weight: 600; font-size: 1rem;
      padding: 0.85rem 1.75rem; min-height: 44px;
      border: none; cursor: pointer; border-radius: 999px;
      background: var(--color-accent-hover); color: #fff;
      box-shadow: 0 1px 4px rgba(13, 148, 136, 0.25);
      transition: background-color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
    }
    .btn:hover { background: var(--color-accent-deep); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(13, 148, 136, 0.35); }

    .footer { background: #111827; color: #9ca3af; text-align: center; padding: 1.5rem; font-size: 0.8125rem; }
    .footer a { color: #9ca3af; }
  </style>
</head>

<body>
  <header class="navbar">
    <nav class="nav-inner">
      <a href="/" class="nav-logo"><span class="logo-erase">erase</span> <span class="logo-friction">friction</span></a>
    </nav>
  </header>

  <main>
    <div class="card">
      <h1>Here's your checklist.</h1>
      <p class="lede">We also sent a copy to your inbox, so it's there whenever you need it.</p>
      <a href="/ai-automation-checklist.pdf" target="_blank" rel="noopener" class="cover-link"
        aria-label="Open the Money-Leak Checklist PDF">
        <img src="/checklist-cover.webp" alt="Cover of The Money-Leak Checklist" width="240" height="311" />
      </a>
      <div class="btn-row">
        <a href="/ai-automation-checklist.pdf" target="_blank" rel="noopener" class="btn">View the checklist &rarr;</a>
        <a href="/ai-automation-checklist.pdf" download="Money-Leak-Checklist.pdf" class="btn btn-secondary">Download PDF</a>
      </div>
      <p class="fine">No email? Check spam or promotions, or write
        <a href="mailto:brooks@erasefriction.com">brooks@erasefriction.com</a>.</p>
      <p class="fine"><a href="/">&larr; Back to home</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; <span id="year">2026</span> erase friction. All rights reserved.</p>
  </footer>

  <script>
    const yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  </script>
</body>

</html>
